name: Build and deploy

on:
  push:
    branches: [main]
  # Allow manual runs from the Actions tab
  workflow_dispatch:

# Permissions needed to publish to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment; cancel runs that are superseded
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Installs the Lean toolchain from lean-toolchain and runs `lake build`. This also checks the
      # Lean proof that every task carries.
      - name: Build Lean project
        uses: leanprover/lean-action@v1
        with:
          test: false
          lint: false
          use-mathlib-cache: false

      # Writes the rendered site to _out/html-multi
      - name: Generate the site
        run: lake exe ipm --output _out/

      # The old addresses of the worlds (Session-N___-…) forward to the new ones (World-N___-…)
      - name: Forward old addresses
        run: ./redirects.sh _out/html-multi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _out/html-multi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
